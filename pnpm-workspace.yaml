allowBuilds:
  '@anthropic-ai/claude-code': true
  '@sentry/cli': true
  bun: true
  cpu-features: false
  esbuild: false
  koffi: false
  msgpackr-extract: false
  msw: true
  opencode-ai: true
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true
auditConfig:
  ignoreGhsas:
    # false positive — matches npm "cli" package, not our "curl.md" workspace
    - GHSA-6cpc-mj5c-m9rq
blockExoticSubdeps: true
catalog:
  hono: ^4.12.16
  # Vite+ dependency aliases.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.20
  vite-plus: 0.1.20
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.20
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - incur
overrides:
  '@protobufjs/utf8@<=1.1.0': 1.1.1
  '@tanstack/start-server-core@<1.167.30': 1.167.30
  basic-ftp@<=5.3.0: 5.3.1
  fast-uri@<=3.1.1: 3.1.2
  fast-xml-builder@<=1.1.6: 1.1.7
  fast-xml-parser@<5.7.0: 5.7.0
  ip-address@<10.1.1: 10.1.1
  protobufjs@<=7.5.5: 7.5.6
  uuid@<14.0.0: 14.0.0
  vite: 'catalog:'
  vitest: 'catalog:'
packageExtensions:
  '@voidzero-dev/vite-plus-core@*':
    dependencies:
      vite-plus: 0.1.20
packages:
  - cli
  - plugins/*
# TODO: Remove once issue is fixed
# https://github.com/TanStack/router/pull/7115
patchedDependencies:
  '@tanstack/react-router@1.168.25': config/patches/@tanstack__react-router@1.168.7.patch
  '@tanstack/router-core@1.168.17': config/patches/@tanstack__router-core@1.168.6.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - effect@4.0.0-beta.48
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1
verifyDepsBeforeRun: false
