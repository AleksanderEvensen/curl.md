packages:
  - cli

# Override undici to avoid miniflare bug where POST + 401 → 500.
# TODO: Remove once miniflare ships with a fixed undici version.
# https://github.com/cloudflare/workers-sdk/issues/12912
overrides:
  miniflare>undici: 7.18.2

auditConfig:
  ignoreGhsas:
    - GHSA-6cpc-mj5c-m9rq # false positive — matches npm "cli" package, not our "curl.md" workspace

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - incur

onlyBuiltDependencies:
  - bun
  - msw
  - simple-git-hooks
  - workerd

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1

catalog:
  hono: ^4.12.7
