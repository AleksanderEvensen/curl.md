name: Preview Comment
description: Create or update preview deployment comment

inputs:
  status:
    description: "Status: building, ready, error, or shut-down"
    required: true
  pr-number:
    description: Pull request number
    required: true
  sha:
    description: Commit SHA
    required: true
  github-token:
    description: GitHub token
    required: true
  run-url:
    description: GitHub Actions run URL (for error/shut-down status)
    required: false

runs:
  using: composite
  steps:
    - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ inputs.pr-number }},
          });
          const botComment = comments.find(c => 
            c.user.type === 'Bot' && c.body.includes('preview deployment')
          );

          const status = '${{ inputs.status }}';
          const apex = 'pr${{ inputs.pr-number }}';
          const domain = 'curl.md';
          const previewUrl = `https://${apex}.${domain}`;
          const updated = new Date().toLocaleString('en-US', { 
            timeZone: 'UTC', 
            month: 'short', 
            day: 'numeric', 
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          });
          const workerName = `curl-pr${{ inputs.pr-number }}`;
          const dashUrl = `https://dash.cloudflare.com/?to=/:account/workers/services/view/${workerName}/production`;
          const sha = '${{ inputs.sha }}'.slice(0, 7);

          const statusConfig = {
            building: { svg: 'https://vercel.com/static/status/building.svg', text: 'Building' },
            ready: { svg: 'https://vercel.com/static/status/ready.svg', text: 'Ready' },
            error: { svg: 'https://vercel.com/static/status/error.svg', text: 'Error' },
            'shut-down': { svg: 'https://vercel.com/static/status/canceled.svg', text: 'Shut Down' },
          };
          const { svg, text } = statusConfig[status];
          const runUrl = '${{ inputs.run-url }}';
          const statusUrl = (status === 'shut-down' || status === 'error') && runUrl ? runUrl : `${dashUrl}/deployments`;
          const previewLink = `[${apex}.${domain}](${previewUrl})`;
          
          let previewCell;
          if (status === 'building' && botComment && botComment.body.includes(`${apex}.${domain}`))
            previewCell = previewLink;
          else if (status === 'ready' || status === 'error' || status === 'shut-down')
            previewCell = previewLink;
          else
            previewCell = '—';

          let body = `The latest preview deployment for ${sha}

          | Name | Status | Preview | Updated (UTC) |
          | :--- | :----- | :------ | :------------ |
          | [${apex}](${dashUrl}) | [![${text}](${svg}) ${text}](${statusUrl}) | ${previewCell} | ${updated} |`.replace(/^          /gm, '');
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr-number }},
              body
            });
          }
