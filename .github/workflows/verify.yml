name: Verify

on:
  workflow_call:
    inputs:
      dispatch_pro_sha:
        description: If set, dispatches pro tests for this commit SHA
        type: string
      dispatch_preview_pr:
        description: If set, dispatches preview deploy for this PR number
        type: string
      submodules:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        if: inputs.submodules
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.CORE_APP_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Checkout submodules
        if: inputs.submodules
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/wevm/curl.md.pro".insteadOf "https://github.com/wevm/curl.md.pro"
          git submodule update --init
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Lint
        run: pnpm check

      - name: Run migrations
        run: pnpm exec wrangler d1 migrations apply DB --local

      - name: Generate types
        run: |
          pnpm gen:types
          pnpm db:codegen

      - name: Check types
        run: pnpm check:types

      - name: Test
        run: pnpm vitest --project app --project cli

      - name: Build
        run: pnpm build

  dispatch:
    name: Dispatch
    needs: check
    if: inputs.dispatch_pro_sha || inputs.dispatch_preview_pr
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.CORE_APP_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Dispatch test
        if: inputs.dispatch_pro_sha
        id: dispatch-test
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BEFORE_ID=$(gh run list --repo wevm/curl.md.pro --event repository_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          printf '{"event_type":"parent-pr-test","client_payload":{"sha":"%s"}}' "${{ inputs.dispatch_pro_sha }}" \
            | gh api repos/wevm/curl.md.pro/dispatches --method POST --input -
          for i in $(seq 1 15); do
            sleep 4
            URL=$(gh run list --repo wevm/curl.md.pro --event repository_dispatch --limit 5 \
              --json databaseId,url --jq "[.[] | select(.databaseId > $BEFORE_ID)] | .[0].url // empty")
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Set test check
        if: inputs.dispatch_pro_sha && steps.dispatch-test.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            --method POST \
            -f name="Pro / Test" \
            -f head_sha="${{ inputs.dispatch_pro_sha }}" \
            -f status=in_progress \
            -f details_url="${{ steps.dispatch-test.outputs.url }}"

      - name: Dispatch preview
        if: inputs.dispatch_preview_pr
        id: dispatch-preview
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BEFORE_ID=$(gh run list --repo wevm/curl.md.pro --event repository_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          printf '{"event_type":"preview-deploy","client_payload":{"sha":"%s","pr_number":"%s"}}' \
            "${{ inputs.dispatch_pro_sha }}" "${{ inputs.dispatch_preview_pr }}" \
            | gh api repos/wevm/curl.md.pro/dispatches --method POST --input -
          for i in $(seq 1 15); do
            sleep 4
            URL=$(gh run list --repo wevm/curl.md.pro --event repository_dispatch --limit 5 \
              --json databaseId,url --jq "[.[] | select(.databaseId > $BEFORE_ID)] | .[0].url // empty")
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Set preview check
        if: inputs.dispatch_preview_pr && steps.dispatch-preview.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            --method POST \
            -f name="Pro / Preview" \
            -f head_sha="${{ inputs.dispatch_pro_sha }}" \
            -f status=in_progress \
            -f details_url="${{ steps.dispatch-preview.outputs.url }}"
