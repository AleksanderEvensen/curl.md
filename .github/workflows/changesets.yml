name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.CORE_APP_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/wevm/curl.md.pro".insteadOf "https://github.com/wevm/curl.md.pro"
          git submodule update --init
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build CLI
        run: pnpm build:cli

      - name: Create release PR or publish
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          commit: "chore: version packages"
          title: "chore: version packages"
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO: uncomment when repo is public
          # NPM_CONFIG_PROVENANCE: true

      - name: Publish preview release
        run: |
          if git diff --quiet HEAD~1 HEAD -- cli/; then
            echo "No changes to publish"
          else
            pnpx pkg-pr-new publish ./cli
          fi
