name: Selfhost Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selfhost
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    environment: selfhost
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Generate selfhost Wrangler config
        env:
          SELFHOST_DOMAIN: ${{ vars.SELFHOST_DOMAIN }}
          SELFHOST_KV_ID: ${{ vars.SELFHOST_KV_ID }}
          SELFHOST_WORKER_NAME: ${{ vars.SELFHOST_WORKER_NAME }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const domain = process.env.SELFHOST_DOMAIN
          const kvId = process.env.SELFHOST_KV_ID
          const workerName = process.env.SELFHOST_WORKER_NAME || 'curl-selfhost'

          if (!domain) throw new Error('Missing GitHub environment variable SELFHOST_DOMAIN')
          if (!kvId) throw new Error('Missing GitHub environment variable SELFHOST_KV_ID')

          const config = {
            $schema: 'node_modules/wrangler/config-schema.json',
            name: workerName,
            main: 'src/entry-server.ts',
            compatibility_date: '2025-10-30',
            compatibility_flags: ['nodejs_compat', 'no_handle_cross_request_promise_resolution'],
            assets: { binding: 'ASSETS', directory: './public' },
            upload_source_maps: true,
            version_metadata: { binding: 'CF_VERSION_METADATA' },
            preview_urls: false,
            ai: { binding: 'AI' },
            kv_namespaces: [{ binding: 'KV', id: kvId }],
            vars: {
              GH_API_URL: 'https://api.github.com',
              GH_URL: 'https://github.com',
              HOST: domain,
              STRIPE_API_URL: 'https://api.stripe.com',
            },
            routes: [{ pattern: domain, custom_domain: true }],
          }

          fs.writeFileSync('wrangler.selfhost.jsonc', JSON.stringify(config, null, 2))
          EOF

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELFHOST_API_KEY: ${{ secrets.SELFHOST_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          wranglerVersion: ''
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.selfhost.jsonc
          environment: selfhost
          secrets: |
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_BROWSER_API_TOKEN
            COOKIE_SECRET
            GH_CLIENT_ID
            GH_CLIENT_SECRET
            SELFHOST_API_KEY
            SENTRY_DSN
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            TOKEN_ENCRYPTION_KEY
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_API_TOKEN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          SELFHOST_API_KEY: ${{ secrets.SELFHOST_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
