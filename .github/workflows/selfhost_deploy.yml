name: Selfhost Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selfhost
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    environment: selfhost
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELFHOST_API_KEY: ${{ secrets.SELFHOST_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Generate selfhost Wrangler config
        env:
          SELFHOST_DOMAIN: ${{ vars.SELFHOST_DOMAIN }}
          SELFHOST_KV_ID: ${{ vars.SELFHOST_KV_ID }}
          SELFHOST_WORKER_NAME: ${{ vars.SELFHOST_WORKER_NAME }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const domain = process.env.SELFHOST_DOMAIN
          const host = process.env.SELFHOST_HOST || domain || 'localhost'
          const kvId = process.env.SELFHOST_KV_ID
          const workerName = process.env.SELFHOST_WORKER_NAME || 'curl-selfhost'
          const config = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'))

          if (!kvId) throw new Error('Missing GitHub environment variable SELFHOST_KV_ID')

          const selfhostConfig = {
            ...config,
            name: workerName,
            main: 'index.js',
            assets: { binding: 'ASSETS', directory: '../client' },
            ai: undefined,
            definedEnvironments: undefined,
            env: undefined,
            hyperdrive: undefined,
            kv_namespaces: [{ binding: 'KV', id: kvId }],
            queues: undefined,
            secrets: undefined,
            triggers: undefined,
            userConfigPath: undefined,
            vars: {
              GH_API_URL: 'https://api.github.com',
              GH_URL: 'https://github.com',
              HOST: host,
              STRIPE_API_URL: 'https://api.stripe.com',
            },
            workers_dev: !domain,
            ...(domain ? { routes: [{ pattern: domain, custom_domain: true }] } : { routes: undefined }),
          }

          fs.writeFileSync('dist/server/wrangler.selfhost.jsonc', JSON.stringify(selfhostConfig, null, 2))
          EOF

      - name: Upload secrets
        run: |
          node --input-type=module <<'EOF' | pnpm exec wrangler secret bulk --config wrangler.selfhost.jsonc
          const secrets = {
            CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_BROWSER_API_TOKEN: process.env.CLOUDFLARE_BROWSER_API_TOKEN,
            COOKIE_SECRET: process.env.COOKIE_SECRET,
            GH_CLIENT_ID: process.env.GH_CLIENT_ID,
            GH_CLIENT_SECRET: process.env.GH_CLIENT_SECRET,
            SELFHOST_API_KEY: process.env.SELFHOST_API_KEY,
            SENTRY_DSN: process.env.SENTRY_DSN,
            STRIPE_SECRET_KEY: process.env.STRIPE_SECRET_KEY,
            STRIPE_WEBHOOK_SECRET: process.env.STRIPE_WEBHOOK_SECRET,
            TOKEN_ENCRYPTION_KEY: process.env.TOKEN_ENCRYPTION_KEY,
          }
          console.log(JSON.stringify(secrets))
          EOF
        working-directory: dist/server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BROWSER_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_API_TOKEN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          SELFHOST_API_KEY: ${{ secrets.SELFHOST_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config wrangler.selfhost.jsonc
        working-directory: dist/server
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
