name: Preview Cleanup

on:
  pull_request:
    types: [closed]

# Share concurrency group with pull_request.yml to wait for any in-progress deploy
concurrency:
  group: preview-${{ github.event.pull_request.number }}

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_NAME: curl-pr${{ github.event.pull_request.number }}
  PREVIEW_KV_NAME: curl-kv-pr${{ github.event.pull_request.number }}
  WRANGLER_SEND_METRICS: false

jobs:
  cleanup:
    name: Cleanup Preview
    if: contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Delete Worker
        run: pnpm exec wrangler delete "$PREVIEW_NAME" --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete KV namespace
        run: |
          KV_ID=$(pnpm exec wrangler kv namespace list | jq -r --arg name "$PREVIEW_KV_NAME" '.[] | select(.title == $name) | .id')
          if [ -n "$KV_ID" ]; then
            pnpm exec wrangler kv namespace delete --namespace-id "$KV_ID" -y || true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update preview comment
        uses: ./.github/actions/preview-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          status: shut-down
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
