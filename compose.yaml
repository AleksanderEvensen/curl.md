name: curl

services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-slim
        RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
        RUN corepack enable
        WORKDIR /app
    command: |
      sh -c "pnpm install --ignore-scripts && pnpm dev --host 0.0.0.0"
    container_name: curl
    restart: unless-stopped
    env_file: .env
    labels:
      - "dev.orbstack.domains=curl.local"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/app/.pnpm-store
      - ./.wrangler:/app/.wrangler
    working_dir: /app

volumes:
  node_modules:
  pnpm-store:
